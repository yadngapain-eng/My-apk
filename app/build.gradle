plugins { id 'com.android.application' }

android {
    namespace 'com.apkeditor.pro'
    compileSdk 34
    defaultConfig {
        applicationId "com.apkeditor.pro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE',
                         'META-INF/LICENSE.txt','META-INF/NOTICE',
                         'META-INF/NOTICE.txt','META-INF/INDEX.LIST',
                         'META-INF/*.SF','META-INF/*.DSA','META-INF/*.RSA',
                         'META-INF/versions/**']
        }
        jniLibs { useLegacyPackaging = true }
    }
    aaptOptions { noCompress 'jar', 'dex' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'net.dongliu:apk-parser:2.6.10'
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.smali:smali:2.5.2'
    implementation 'org.smali:baksmali:2.5.2'
    // Apktool library (bukan CLI) — dipakai ApktoolRunner
    implementation 'org.apktool:apktool-lib:2.9.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    // Local JAR
    implementation files('libs/apksig-8.2.2.jar')
    implementation files('libs/ARSCLib-1.4.0.jar')
}